services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: labface
      POSTGRES_USER: labface_user
      POSTGRES_PASSWORD: labface_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./full_dump.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labface_user -d labface"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=labface
      - DB_USER=labface_user
      - DB_PASSWORD=labface_pass

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
